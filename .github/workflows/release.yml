name: android-release

# Builds signed-or-unsigned release artifacts (AAB + APK) of the launcher
# shell for store uploads. The app UI loads from the user's server at runtime,
# so releases are decoupled from upstream versions.
# Manual trigger ONLY: Actions -> android-release -> Run workflow.
#
# Inputs:
#   version_name -- e.g. 1.2.3 (empty = keep generated default).
#
# Signing: configure these repo secrets to get signed artifacts --
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# Without them the workflow still succeeds but uploads UNSIGNED artifacts
# (fine for local testing, not for the Play Store).

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release versionName (e.g. 1.2.3). Empty = keep default.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # needed to create tags + GitHub Releases
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check launcher
        run: npm run check:launcher

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install JS deps
        run: npm install --no-audit --no-fund

      - name: Capacitor sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply versionName override
        if: inputs.version_name != ''
        run: |
          sed -i "s/versionName \".*\"/versionName \"${{ inputs.version_name }}\"/" android/app/build.gradle
          grep -n "versionName" android/app/build.gradle | head -2

      - name: Build release AAB + APK
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease

      # NOTE: `secrets.*` must not appear in step `if:` expressions in this
      # repo's workflows (GitHub rejects the event at parse time with
      # "Unrecognized named-value: 'secrets'"). Resolve once via env + shell,
      # then gate on the step output instead.
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

      - name: Sign release artifacts (AAB via jarsigner, APK via apksigner)
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # NOTE: apksigner password forms vary by build-tools version
          # (`:env` is rejected on some runners), so pass passwords via files,
          # which every version accepts. Temp filenames avoid matching secret
          # values so GitHub log-masking doesn't mangle the output.
          echo "$KEYSTORE_B64" | base64 -d > /tmp/app-signing.jks
          printf '%s' "$KEYSTORE_PASSWORD" > /tmp/ks-pass.txt
          printf '%s' "$KEY_PASSWORD" > /tmp/key-pass.txt
          AAB=(android/app/build/outputs/bundle/release/*.aab)
          APK=(android/app/build/outputs/apk/release/*.apk)
          jarsigner -keystore /tmp/app-signing.jks -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" "${AAB[0]}" "$KEY_ALIAS"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)"
          "$APKSIGNER" sign --ks /tmp/app-signing.jks \
            --ks-pass:file /tmp/ks-pass.txt --key-pass:file /tmp/key-pass.txt \
            --ks-key-alias "$KEY_ALIAS" --out "${APK[0]%.apk}-signed.apk" "${APK[0]}"
          rm -f /tmp/app-signing.jks /tmp/ks-pass.txt /tmp/key-pass.txt

      - name: Note unsigned artifacts
        if: steps.signing.outputs.enabled != 'true'
        run: echo "::warning::No signing secrets configured -- uploading UNSIGNED artifacts (not for store upload)."

      - name: Resolve release tag
        id: meta
        run: |
          if [ -n "${{ inputs.version_name }}" ]; then TAG="v${{ inputs.version_name }}"; else TAG="build-${{ github.run_number }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Prepare release files (stable names)
        id: files
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          mkdir -p dist-release
          AAB=(android/app/build/outputs/bundle/release/*.aab)
          cp "${AAB[0]}" "dist-release/odysseus-$TAG.aab"
          if compgen -G "android/app/build/outputs/apk/release/*-signed.apk" > /dev/null; then
            cp android/app/build/outputs/apk/release/*-signed.apk "dist-release/odysseus-$TAG.apk"
            SIGNED="signed"
          else
            cp android/app/build/outputs/apk/release/*.apk "dist-release/odysseus-$TAG.apk"
            SIGNED="UNSIGNED (testing only — not for the Play Store)"
          fi
          ls -la dist-release
          {
            echo "body<<EOF"
            echo "Odysseus Android launcher shell ($TAG)."
            echo
            echo "Artifacts: $SIGNED."
            echo "Point the app at your server on first launch; the UI loads from there."
            echo "Built from ${{ github.sha }} (run #${{ github.run_number }})."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Odysseus Android ${{ steps.meta.outputs.tag }}
          body: ${{ steps.files.outputs.body }}
          draft: false
          prerelease: ${{ steps.signing.outputs.enabled != 'true' }}
          files: dist-release/*
