name: android-release

# Builds signed-or-unsigned release artifacts (AAB + APK) for store uploads.
# Manual trigger ONLY: Actions -> android-release -> Run workflow.
#
# Inputs:
#   upstream_ref — upstream odysseus ref (empty = upstream.ref file).
#   version_name — e.g. 1.2.3 (empty = keep generated default).
#
# Signing: configure these repo secrets to get signed artifacts —
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# Without them the workflow still succeeds but uploads UNSIGNED artifacts
# (fine for local testing, not for the Play Store).

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream odysseus ref (branch, tag, or commit SHA). Empty = upstream.ref file.'
        required: false
        default: ''
      version_name:
        description: 'Release versionName (e.g. 1.2.3). Empty = keep default.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install JS deps
        run: npm install --no-audit --no-fund

      - name: Sync from upstream (strict)
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
          STRICT: 1
        run: |
          if [ -z "${UPSTREAM_REF}" ]; then unset UPSTREAM_REF; fi
          npm run sync:upstream
          cat www/.upstream.json

      - name: Record upstream SHA
        id: stamp
        run: echo "sha=$(node -p "require('./www/.upstream.json').sha.slice(0,12)")" >> "$GITHUB_OUTPUT"

      - name: Capacitor sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply versionName override
        if: inputs.version_name != ''
        run: |
          sed -i "s/versionName \".*\"/versionName \"${{ inputs.version_name }}\"/" android/app/build.gradle
          grep -n "versionName" android/app/build.gradle | head -2

      - name: Build release AAB + APK
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease

      - name: Sign release artifacts
        if: secrets.ANDROID_KEYSTORE_BASE64 != ''
        uses: r0adkirby/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '34.0.0'

      - name: Sign release APK
        if: secrets.ANDROID_KEYSTORE_BASE64 != ''
        uses: r0adkirby/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '34.0.0'

      - name: Note unsigned artifacts
        if: secrets.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::No signing secrets configured — uploading UNSIGNED artifacts (not for store upload)."

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: odysseus-release-${{ steps.stamp.outputs.sha }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30
