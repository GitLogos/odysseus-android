name: android-debug

# Builds a debuggable APK from the upstream-synced web bundle.
# Manual trigger: Actions -> android-debug -> Run workflow (optional ref).
# Also runs weekly so breakage is caught without manual action.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream odysseus ref (branch, tag, or commit SHA). Empty = upstream.ref file.'
        required: false
        default: ''
  schedule:
    - cron: '0 6 * * 2'

concurrency:
  group: android-debug-${{ inputs.upstream_ref || 'pinned' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install JS deps
        run: npm install --no-audit --no-fund

      - name: Sync from upstream (strict)
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
          STRICT: 1
        run: |
          if [ -z "${UPSTREAM_REF}" ]; then unset UPSTREAM_REF; fi
          npm run sync:upstream
          cat www/.upstream.json

      - name: Record upstream SHA
        id: stamp
        run: echo "sha=$(node -p "require('./www/.upstream.json').sha.slice(0,12)")" >> "$GITHUB_OUTPUT"

      - name: Capacitor sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: odysseus-debug-${{ steps.stamp.outputs.sha }}-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
