name: android-debug

# Builds a debuggable APK of the launcher shell (no upstream dependency —
# the app loads its UI from the user's server at runtime).
# Manual trigger: Actions -> android-debug -> Run workflow.
# Also runs weekly so toolchain breakage is caught without manual action.

on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher/**'
      - 'assets/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/android-debug.yml'
  schedule:
    - cron: '0 6 * * 2'

concurrency:
  group: android-debug
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check launcher
        run: npm run check:launcher

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install JS deps
        run: npm install --no-audit --no-fund

      - name: Capacitor sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate launcher icons (if assets/icon.png present)
        run: |
          if [ -f assets/icon.png ]; then npm run mobile:assets; else echo "No assets/icon.png — keeping default icons."; fi

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: odysseus-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
