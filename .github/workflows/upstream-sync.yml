name: upstream-sync

# Validates that the web UI still syncs cleanly from upstream at the pinned
# (or manually given) ref. Fast: Node + git only, no Android SDK.
# Manual trigger: Actions -> upstream-sync -> Run workflow (optional ref).

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream odysseus ref (branch, tag, or commit SHA). Empty = upstream.ref file.'
        required: false
        default: ''
  push:
    paths:
      - 'scripts/**'
      - 'overlay/**'
      - 'upstream.ref'
      - 'package.json'
      - '.github/workflows/upstream-sync.yml'
  schedule:
    # Weekly canary: catches upstream layout changes that break our patching.
    - cron: '0 6 * * 1'

concurrency:
  group: upstream-sync-${{ inputs.upstream_ref || 'pinned' }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync from upstream (strict)
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
          STRICT: 1
        run: |
          if [ -z "${UPSTREAM_REF}" ]; then unset UPSTREAM_REF; fi
          npm run sync:upstream
          cat www/.upstream.json

      - name: Record upstream SHA
        id: stamp
        run: echo "sha=$(node -p "require('./www/.upstream.json').sha.slice(0,12)")" >> "$GITHUB_OUTPUT"

      - name: Upload staged bundle
        uses: actions/upload-artifact@v4
        with:
          name: www-${{ steps.stamp.outputs.sha }}
          path: www/
          retention-days: 7
